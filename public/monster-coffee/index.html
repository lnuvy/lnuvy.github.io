<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F4F7FC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1626" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="재고 체크">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>매장 재고 체크</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: phone-first single column. App bar → greeting → hero card → stat cards → item cards; fixed bottom nav.
   Blue base (Codex 시안 A). Category tint lives on the item icon tile; owner's thresholds stay as blue "pen" handwriting. */
:root{
  --bg:#F4F7FC; --surface:#FFFFFF; --ink:#182E50; --muted:#6F7E94; --line:#DFE7F2;
  --primary:#3478E5; --primary-strong:#2560BA; --primary-ink:#FFFFFF; --soft:#EAF2FF;
  --danger:#B85F42; --danger-soft:#FFF0E9; --warn:#946300; --warn-soft:#FFF4D9;
  --ok:#407566; --ok-soft:#E7F3EE; --pen:#2B57C4; --scrim:rgba(16,30,56,.42); --shadow:rgba(24,46,80,.06);
  --tile-l:94%; --tile-ic-l:40%;
  --f-body:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-pen:"Nanum Pen Script","Pretendard Variable",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1626; --surface:#162236; --ink:#E6EDF8; --muted:#93A3BC; --line:#26354F;
  --primary:#5C9BFF; --primary-strong:#8AB6FF; --primary-ink:#0B1424; --soft:#1A2C4A;
  --danger:#FF9C7C; --danger-soft:#3A2119; --warn:#F2C25B; --warn-soft:#33290F;
  --ok:#7CC7AE; --ok-soft:#163028; --pen:#A4BEFF; --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.25);
  --tile-l:22%; --tile-ic-l:76%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1626; --surface:#162236; --ink:#E6EDF8; --muted:#93A3BC; --line:#26354F;
  --primary:#5C9BFF; --primary-strong:#8AB6FF; --primary-ink:#0B1424; --soft:#1A2C4A;
  --danger:#FF9C7C; --danger-soft:#3A2119; --warn:#F2C25B; --warn-soft:#33290F;
  --ok:#7CC7AE; --ok-soft:#163028; --pen:#A4BEFF; --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.25);
  --tile-l:22%; --tile-ic-l:76%; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;padding-top:env(safe-area-inset-top,0px);background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;letter-spacing:-.01em}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,p{margin:0}
h1{font-size:24px;font-weight:700;letter-spacing:-.025em;text-wrap:balance}
.wrap{max-width:560px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:0 150px;display:flex;flex-direction:column;gap:18px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* app bar */
.appbar{display:flex;align-items:center;gap:10px;padding-block:14px 2px}
.appbar .logo{width:34px;height:34px;border-radius:10px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center}
.appbar .logo svg{width:20px;height:20px}
.appbar b{font-size:15px;font-weight:700;flex:1}
.role{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.role i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.iconbtn{width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:var(--soft)}
.iconbtn:disabled{opacity:.3;cursor:default;background:transparent}
.catrow{position:relative;background:var(--surface);transition:transform .16s ease}
.catrow .iconbtn{width:32px;height:32px}
.catrow.dragging{transition:none;z-index:3;box-shadow:0 10px 28px var(--scrim);border-radius:14px;border-top-color:transparent}
.grip{width:30px;height:40px;flex:none;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;border-radius:8px}
.grip svg{stroke-width:3.2}
.catrow.dragging .grip{cursor:grabbing;color:var(--primary)}
body.dragging-cat{-webkit-user-select:none;user-select:none}
/* greeting + hero */
.greet{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.sub{font-size:14px;color:var(--muted)}
.hero{position:relative;overflow:hidden;background:var(--soft);border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.hero h2{font-size:21px;font-weight:700;line-height:1.35;letter-spacing:-.025em;max-width:15em;text-wrap:balance;position:relative}
.hero h2 em{font-style:normal;color:var(--primary)}
.hero p{font-size:14px;color:var(--muted);max-width:19em;position:relative}
.hero .art{position:absolute;right:-6px;bottom:-8px;width:104px;height:104px;opacity:.9}
.hero .btn{position:relative;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;box-shadow:0 1px 2px var(--shadow)}
.stat .lab{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.stat .lab svg{width:16px;height:16px}
.stat b{font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat b small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.stat.danger b{color:var(--danger)} .stat.warn b{color:var(--warn)} .stat.info b{color:var(--primary)}
/* sections + cards */
.sec{display:flex;flex-direction:column;gap:10px;scroll-margin-top:16px}
.sechead{display:flex;align-items:center;gap:8px}
.sechead h3{font-size:17px;font-weight:700}
.count{font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--danger-soft);color:var(--danger)}
.count.warn{background:var(--warn-soft);color:var(--warn)} .count.info{background:var(--soft);color:var(--primary)}
.secsub{font-size:13px;color:var(--muted);margin-top:-6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px var(--shadow)}
.list{display:flex;flex-direction:column;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:14px 14px;border-top:1px solid var(--line);min-width:0}
.list>.item:first-child,.list>.grp:first-child>.item,.list>.grphead:first-child+.item{border-top:0}
.tile{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;background:hsl(var(--h) var(--s) var(--tile-l));color:hsl(var(--h) var(--s) var(--tile-ic-l))}
.tile svg{width:21px;height:21px}
.tile.sm{width:34px;height:34px;border-radius:10px}
.tile.sm svg{width:18px;height:18px}
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.name{font-weight:650;font-size:15px;overflow-wrap:anywhere;display:flex;align-items:center;gap:6px}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;column-gap:6px;align-items:baseline}
.pen{font-family:var(--f-pen);color:var(--pen);font-size:19px;line-height:1;letter-spacing:0;white-space:nowrap}
.qtyblk{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:0;flex:none}
.qtyblk b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.qtyblk b small{font-size:12px;font-weight:600;color:var(--muted);margin-left:2px}
.qtyblk span{font-size:11.5px;color:var(--muted)}
.st-order .qtyblk b{color:var(--danger)} .st-low .qtyblk b{color:var(--warn)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}
.badge{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.b-order{background:var(--danger-soft);color:var(--danger)} .b-low{background:var(--warn-soft);color:var(--warn)}
.b-pending{background:var(--soft);color:var(--primary)} .b-ok{background:var(--ok-soft);color:var(--ok)} .b-mute{background:var(--bg);color:var(--muted)}
.chev{color:var(--muted);width:18px;height:18px}
.tap{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;min-width:0}
/* buttons + inputs */
.btn{font:inherit;font-weight:650;font-size:14px;border-radius:12px;padding:10px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.btn.soft{background:var(--soft);color:var(--primary);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{font-size:13px;padding:7px 11px;border-radius:10px}
.btn.block{width:100%;padding:13px 16px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.textbtn{background:none;border:0;padding:6px 0;font:inherit;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;align-self:center}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-width:0;width:100%}
input:focus,select:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--soft)}
input.num{width:72px;text-align:center;font-weight:650;font-variant-numeric:tabular-nums;padding:9px 6px;background:var(--bg)}
input.num.narrow{width:58px}
input.filled{border-color:var(--primary);background:var(--soft)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.field small{font-weight:400;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.withunit{display:flex;align-items:center;gap:8px}
.withunit span{font-size:14px;color:var(--muted);font-weight:600;white-space:nowrap}
.search{position:relative;flex:1;min-width:0}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search input{padding-left:38px}
.toolbar{display:flex;gap:8px;align-items:stretch}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding-inline:18px}
.sheet .chips{margin-inline:-20px;padding-inline:20px}
.chips::-webkit-scrollbar{display:none}
.chip{font:inherit;font-size:13px;font-weight:650;border:1px solid var(--line);border-radius:999px;padding:7px 12px;white-space:nowrap;cursor:pointer;color:var(--ink);background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:transparent}
.chip .n{color:var(--muted);margin-left:4px;font-weight:600}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-block:-8px}
.note{font-size:13.5px;border-radius:14px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.note .grow{flex:1;min-width:12em}
.progress{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--primary);border-radius:999px}
.grphead{display:flex;align-items:center;gap:8px;padding:12px 14px 4px;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.02em;scroll-margin-top:64px}
.grphead .sw{width:8px;height:8px;border-radius:3px;background:hsl(var(--h) var(--s) var(--tile-ic-l))}
.grphead+.item{border-top:0}
.empty{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:22px 20px}
.empty h2{font-size:18px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.err{color:var(--danger);font-size:13px;font-weight:600}
/* count rows */
.crow{flex-wrap:wrap}
.crow .main{flex:1 1 140px}
.inputs{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:13px;color:var(--muted)}
.total{min-width:46px;text-align:right;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.warnline{font-size:12.5px;color:var(--warn);font-weight:600}
.warnline:empty{display:none}
/* bars */
.bar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--surface);border-top:1px solid var(--line)}
.bar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between;padding-block:10px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));font-size:14px;font-weight:600}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:64px}
.tabs a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);text-decoration:none}
.tabs a svg{width:23px;height:23px}
.tabs a[aria-current="page"]{color:var(--ink)}
.tabs a[aria-current="page"]::after{content:"";position:absolute;bottom:7px;width:18px;height:3px;border-radius:2px;background:var(--primary)}
/* sheet */
.sheetwrap{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:24px 24px 0 0;padding-top:8px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 4px;flex:none}
.sheethead{display:flex;align-items:center;gap:12px}
.sheethead h2{font-size:19px;font-weight:700}
.sheethead p{font-size:13px;color:var(--muted)}
.sheet .divider{height:1px;background:var(--line);flex:none}
.sheet ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.sheet li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:9px 12px;font-size:14px}
.actions{display:flex;gap:8px}
.actions .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;max-width:calc(100% - 36px);box-shadow:0 8px 24px var(--scrim)}
.diff{font-size:13px;color:var(--muted);padding:0 14px 14px 60px;display:flex;flex-wrap:wrap;gap:4px 12px}
.diff b{color:var(--ink);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(40px)}to{transform:none}}}
</style>
</head>
<body>
<div class="wrap" id="view" aria-live="polite"></div>
<nav class="tabs" aria-label="화면">
  <div class="in">
    <a href="#home" data-tab="home"><svg class="i" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8.5a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H5.5A1.5 1.5 0 0 1 4 19.5z"/></svg>오늘의 매장</a>
    <a href="#count" data-tab="count"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 3.5h6v3H9zM9 12l2 2 4-4M9 17h6"/></svg>재고 조사</a>
    <a href="#log" data-tab="log"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>기록</a>
    <a href="#setup" data-tab="setup" data-owner hidden><svg class="i" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>품목 관리</a>
  </div>
</nav>
<div id="toast" class="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="app-api.js"></script>
<script>
(function(){
'use strict';

/* ---------- 분류 (코팅 조사표의 칸 순서). 품목 자체는 서버(Lambda)에만 있다 ---------- */
var CATS=[
  {id:'powder',name:'파우더',h:42,s:'80%',ic:'jar'},{id:'topping',name:'토핑',h:150,s:'45%',ic:'spark'},
  {id:'coffee',name:'커피',h:350,s:'60%',ic:'coffee'},{id:'tea',name:'티백',h:95,s:'40%',ic:'leaf'},
  {id:'syrup',name:'시럽',h:215,s:'70%',ic:'bottle'},{id:'base',name:'원액·잼',h:285,s:'45%',ic:'jar2'},
  {id:'soda',name:'탄산',h:25,s:'80%',ic:'can'},{id:'etc',name:'기타',h:215,s:'12%',ic:'box'},
  {id:'fruit',name:'과일',h:0,s:'60%',ic:'fruit'},{id:'takeout',name:'테이크아웃',h:230,s:'45%',ic:'cup'},
  {id:'dairy',name:'유제품',h:200,s:'55%',ic:'milk'},{id:'dessert',name:'디저트',h:20,s:'60%',ic:'cake'},
  {id:'season',name:'시즌',h:48,s:'85%',ic:'sun'}
];
var CAT_BY={}; CATS.forEach(function(c){CAT_BY[c.id]=c;});
var EXTRA_HUES=[205,165,325,35,265,110,0,240,185,300];
function cats(){
  var base=S.catalog&&Array.isArray(S.catalog.cats)&&S.catalog.cats.length?S.catalog.cats:CATS;
  return base.map(function(c,i){var m=CAT_BY[c.id];
    return {id:c.id,name:c.name||(m&&m.name)||'분류',h:m?m.h:(c.h!=null?c.h:EXTRA_HUES[i%EXTRA_HUES.length]),s:m?m.s:'50%',ic:m?m.ic:'box'};});
}
function catById(id){var l=cats();for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];return CAT_BY[id]||{id:id,name:'분류 없음',h:215,s:'12%',ic:'box'};}
var ICON={

function svg(d,cls){return '<svg class="i'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true"><path d="'+d+'"/></svg>';}
function tile(cat,small){var c=catById(cat);return '<span class="tile'+(small?' sm':'')+'" style="'+catStyle(c)+'">'+svg(ICON[c.ic]||ICON.box)+'</span>';}
var DEFAULT_UNIT='팩'; // 누나가 정한 기본 세는 단위 (2026-10-31). 비어 있거나 공백뿐인 단위는 팩으로 본다
var UNITS=['팩','개','봉','병','박스','통','kg','L'];
function normUnit(u){var t=typeof u==='string'?u.trim():'';return t||DEFAULT_UNIT;}
function normCatalog(cat){
  if(!cat||!Array.isArray(cat.items))return cat||null;
  return Object.assign({},cat,{items:cat.items.map(function(i){return i.unit===normUnit(i.unit)?i:Object.assign({},i,{unit:normUnit(i.unit)});})});
}

/* ---------- helpers ---------- */
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
var DOW='일월화수목금토';
function fmtMs(ms){var d=new Date(ms);return (d.getMonth()+1)+'/'+d.getDate()+'('+DOW[d.getDay()]+')';}
function fmtMsTime(ms){var d=new Date(ms);return fmtMs(ms)+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function dayStart(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).getTime();}
function fmtYmd(s){var d=new Date(dayStart(s));return (d.getMonth()+1)+'/'+d.getDate()+'('+DOW[d.getDay()]+')';}
function num(v){if(v==null)return null;var t=String(v).replace(/,/g,'').trim();if(t==='')return null;if(!/^\d+(\.\d+)?$/.test(t))return NaN;return Math.round(Number(t)*100)/100;}
function fq(q,u){if(q==null)return '—';var s=Number.isInteger(q)?String(q):String(Math.round(q*10)/10);return s+(u||'');}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function lsGet(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function catStyle(c){c=c||CAT_BY.etc;return '--h:'+c.h+';--s:'+c.s;}

/* ---------- state ---------- */
var LS_DRAFT='mc-inv-draft-v1', LS_BY='mc-inv-by', LS_CACHE='mc-inv-cache-v1';
var API=window.MC_API;
var S={mode:'loading',role:null,catalog:null,counts:[],orders:[],offline:false,errMsg:'',loginErr:'',
  draft:lsGet(LS_DRAFT)||{},by:lsGet(LS_BY)||'',filter:'all',cat:'all',q:'',sheet:null,sheetErr:'',logOpen:null,deferred:false};
var route='home';

function items(){return S.catalog&&Array.isArray(S.catalog.items)?S.catalog.items:[];}
function activeItems(){return items().filter(function(i){return i.active!==false;});}
function itemById(id){var a=items();for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
function isOwner(){return S.role==='owner';}

/* ---------- 서버 (AWS Lambda + DynamoDB) ---------- */
function applyData(d){
  S.role=d.role;S.catalog=normCatalog(d.catalog);S.counts=d.counts||[];
  S.orders=(d.orders||[]).map(function(o){return Object.assign({},o,{qty:Number(o.qty)});});
  lsSet(LS_CACHE,{role:S.role,catalog:S.catalog,counts:S.counts,orders:S.orders});
}
var loading=null;
function refresh(){
  if(!API.getCode()){S.mode='login';S.forceRender=true;render();return Promise.resolve();}
  if(loading)return loading.then(function(){return refresh();});
  loading=API.call('load').then(function(d){
    S.mode='ready';S.offline=false;applyData(d);render();
  },function(e){
    if(e.code==='auth')logout('매장 코드가 바뀌었어요. 새 코드를 넣어 주세요.');
    else{S.offline=true;S.errMsg=e.message;if(S.mode==='loading')S.mode=S.catalog?'ready':'error';render();}
  }).then(function(){loading=null;});
  return loading;
}
function logout(msg){
  API.setCode('');lsSet(LS_CACHE,null);
  S.role=null;S.catalog=null;S.counts=[];S.orders=[];S.mode='login';S.loginErr=msg||'';S.sheet=null;S.forceRender=true;render();
}
function run(fn,ok){
  return Promise.resolve().then(fn).then(function(){
    if(ok)toast(ok);
    return refresh().then(function(){return true;});
  },function(e){
    if(e&&e.code==='auth'){logout('매장 코드가 바뀌었어요. 새 코드를 넣어 주세요.');return false;}
    toast((e&&e.message)||'저장하지 못했어요. 잠시 후 다시 해주세요.');
    return false;
  });
}
var store={
  seed:function(){return API.call('seed');},
  setCatalog:function(cat){return API.call('setCatalog',{data:cat}).then(function(){S.catalog=cat;});},
  addCount:function(id,doc){return API.call('putCount',{id:id,at:doc.at,by:doc.by,values:doc.values}).then(function(){
    S.counts=[Object.assign({id:id},doc)].concat(S.counts);});},
  putOrder:function(o){return API.call('putOrder',o).then(function(){
    S.orders=[o].concat(S.orders.filter(function(x){return x.id!==o.id;})).sort(function(a,b){return b.at-a.at;});});}
};

/* ---------- derived ---------- */
function historyOf(id){
  var out=[];
  for(var i=0;i<S.counts.length;i++){var c=S.counts[i];var v=c.values&&c.values[id];if(typeof v==='number')out.push({qty:v,at:c.at,by:c.by});}
  return out;
}
function arrivedByCount(o){
  var t=dayStart(o.eta);
  return S.counts.some(function(c){return c.at>=t&&c.at>o.at&&c.values&&typeof c.values[o.itemId]==='number';});
}
function openOrderOf(id){
  for(var i=0;i<S.orders.length;i++){var o=S.orders[i];if(o.itemId===id&&o.status==='open'&&!arrivedByCount(o))return o;}
  return null;
}
function info(item){
  var h=historyOf(item.id), last=h[0]||null, o=openOrderOf(item.id), th=item.threshold, qty=last?last.qty:null, st;
  var today=ymd(new Date());
  if(o)st=today<=o.eta?'pending':'late';
  else if(th==null)st='unset';
  else if(qty==null)st='uncounted';
  else if(qty<=th)st='order';
  else if(qty<=th+Math.max(1,Math.ceil(th*0.5)))st='low';
  else st='ok';
  return {item:item,last:last,prev:h[1]||null,order:o,qty:qty,st:st};
}
function orderStatusLabel(o){
  if(o.status==='cancelled')return '취소';
  if(o.status==='done')return '도착';
  if(arrivedByCount(o))return '조사로 확인';
  return ymd(new Date())<=o.eta?'입고 대기':'도착 확인 필요';
}

/* ---------- draft (재고 조사 입력) ---------- */
function totalOf(item,d){
  if(!d)return null;
  if(item.perBox){var b=num(d.box),l=num(d.loose);if(b==null&&l==null)return null;if(Number.isNaN(b)||Number.isNaN(l))return NaN;return Math.round(((b||0)*item.perBox+(l||0))*100)/100;}
  return num(d.n);
}
function anomaly(inf,q){
  if(q==null)return '';
  if(Number.isNaN(q))return '숫자로 적어주세요';
  if(q===0)return '품절(0)로 기록돼요';
  var p=inf.last?inf.last.qty:null; if(p==null)return '';
  var u=inf.item.unit;
  var ordered=S.orders.some(function(o){return o.itemId===inf.item.id&&o.status!=='cancelled'&&o.at>inf.last.at;});
  if(q>p&&!ordered&&q-p>=Math.max(2,Math.ceil(p*0.5)))return '지난번 '+fq(p,u)+'보다 많아요. 주문 기록이 없어요';
  if(q<p&&p-q>=Math.max(2,Math.ceil(p*0.5)))return '지난번 '+fq(p,u)+'의 절반 아래예요. 박스 아래층까지 셌나요?';
  return '';
}
function draftEntries(){
  var out=[];
  activeItems().forEach(function(it){var q=totalOf(it,S.draft[it.id]);if(q!=null)out.push({item:it,q:q});});
  return out;
}
function saveDraft(){lsSet(LS_DRAFT,S.draft);}

/* ---------- render ---------- */
function editingField(){var a=document.activeElement;return !!(a&&a.closest&&a.closest('#view')&&a.matches('input,select'));}
function render(){
  if(editingField()&&!S.forceRender){S.deferred=true;return;}
  S.deferred=false;S.forceRender=false;
  if(route==='setup'&&S.mode==='ready'&&!isOwner())route='home';
  $('.tabs').hidden=S.mode==='login';
  document.querySelectorAll('.tabs a').forEach(function(a){
    if(a.hasAttribute('data-owner'))a.hidden=!isOwner();
    if(a.getAttribute('data-tab')===route)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  var html;
  if(S.mode==='login')html=loginScreen();
  else if(S.mode==='loading')html=appbar()+'<p class="sub">불러오는 중…</p>';
  else if(S.mode==='error')html=appbar()+'<div class="card empty"><h2>서버에 연결하지 못했어요</h2><p class="sub">'+esc(S.errMsg)+'</p><button class="btn primary" data-act="retry">다시 시도</button></div>';
  else if(!S.catalog)html=appbar()+emptyScreen();
  else{
    html=appbar()+offlineNote();
    if(route==='count')html+=countScreen();
    else if(route==='log')html+=logScreen();
    else if(route==='setup')html+=setupScreen();
    else html+=homeScreen();
  }
  html+=sheetHtml();
  $('#view').innerHTML=html;
  document.body.classList.toggle('lock',!!S.sheet);
}

}

  '<ol class="steps"><li>품목 관리에서 품목마다 주문기준을 적어요</li><li>재고 조사에서 수량을 입력해요</li><li>오늘의 매장에 주문할 품목이 빨갛게 떠요</li></ol>'+
  '<button class="btn primary" data-act="start">조사표 품목으로 시작하기</button></div>';

function todayLabel(){var d=new Date();return (d.getMonth()+1)+'월 '+d.getDate()+'일 '+DOW[d.getDay()]+'요일';}
function lastCountLine(){
  var c=S.counts[0]; if(!c)return '아직 재고 조사 기록이 없어요';
  var days=Math.floor((dayStart(ymd(new Date()))-dayStart(ymd(new Date(c.at))))/864e5);
  return '최근 재고 조사 '+fmtMs(c.at)+(c.by?' · '+esc(c.by):'')+(days>=4?' · <b style="color:var(--warn)">'+days+'일 전</b>':'');
}
function thLabel(it){return it.threshold!=null?'<span class="pen">'+fq(it.threshold,it.unit)+' 이하 주문</span>':'';}

function homeItem(inf,kind){
  var it=inf.item,u=it.unit,right='',meta;
  if(kind==='pending'||kind==='late'){
    meta='<span>주문 '+fq(inf.order.qty,u)+'</span><span>· '+fmtYmd(inf.order.eta)+(kind==='late'?' 도착 예정이었어요':' 도착 예정')+'</span>';
    right=isOwner()?'<div style="display:flex;flex-direction:column;gap:6px"><button class="btn sm soft" data-act="order-done" data-id="'+esc(inf.order.id)+'">도착했어요</button><button class="btn sm ghost" data-act="order-drop" data-id="'+esc(inf.order.id)+'">취소</button></div>':'<span class="badge '+(kind==='late'?'b-low':'b-pending')+'">'+(kind==='late'?'도착 확인':'입고 대기')+'</span>';
  }else{
    meta='<span>'+esc(catById(it.cat).name)+'</span>'+thLabel(it);
    right='<div class="qtyblk"><b>'+fq(inf.qty)+'<small>'+esc(u)+'</small></b><span>'+(inf.last?fmtMs(inf.last.at):'')+'</span></div>'+
      (isOwner()?'<button class="btn sm '+(kind==='order'?'primary':'soft')+'" data-act="order-open" data-id="'+esc(it.id)+'">주문했어요</button>':'');
  }
  return '<div class="item st-'+kind+'">'+tile(it.cat)+'<div class="main"><div class="name">'+esc(it.name)+'</div><div class="meta">'+meta+'</div></div>'+right+'</div>';

function hero(c){

/* ---------- 품목 관리 ---------- */
function setupFiltered(){
  var q=S.q.trim(),ord={};cats().forEach(function(c,i){ord[c.id]=i;});
  return items().filter(function(i){
    if(S.cat!=='all'&&i.cat!==S.cat)return false;
    if(q&&i.name.indexOf(q)<0)return false;
    if(S.filter==='hidden')return i.active===false;
    if(i.active===false)return false;
    if(S.filter==='unset')return i.threshold==null;
    if(S.filter==='review')return !!i.review;
    return true;
  }).sort(function(a,b){
    var oa=ord[a.cat],ob=ord[b.cat];
    return ((oa==null?999:oa)-(ob==null?999:ob))||a.name.localeCompare(b.name,'ko',{numeric:true});
  });
}

  });

  if(s.type==='review')body=reviewSheet();
  else if(s.type==='item')body=itemSheet(itemById(s.id),false);
  else if(s.type==='add')body=itemSheet(null,true);
  else if(s.type==='order')body=orderSheet(itemById(s.id));
  else if(s.type==='cats')body=catsSheet();

function catsSheet(){
  var list=S.sheet.list,n=list.length,cnt={};
  items().forEach(function(i){cnt[i.cat]=(cnt[i.cat]||0)+1;});
  var h='<div class="sheethead"><div style="min-width:0"><h2>분류 관리</h2><p>여기 순서대로 재고 조사와 품목 관리에 보여요</p></div>'+closeBtn()+'</div>';
  h+='<div class="card list">'+list.map(function(c,i){
    var meta=catById(c.id),k=cnt[c.id]||0;
    var look={h:meta.h!=null&&CAT_BY[c.id]?meta.h:(c.h!=null?c.h:EXTRA_HUES[i%EXTRA_HUES.length]),s:CAT_BY[c.id]?meta.s:'50%'};
    return '<div class="item catrow" style="gap:6px;padding:10px 8px 10px 4px"><button class="grip" data-i="'+i+'" aria-label="끌어서 순서 바꾸기" tabindex="-1">'+svg(UI.grip)+'</button><span class="tile sm" style="'+catStyle(look)+'">'+svg(ICON[CAT_BY[c.id]?CAT_BY[c.id].ic:'box'])+'</span>'+
      '<div class="main" style="gap:4px"><input class="catname" data-ci="'+i+'" value="'+esc(c.name)+'" maxlength="12" aria-label="분류 이름" style="padding:7px 10px;font-size:15px;font-weight:650"><span class="meta"><span>품목 '+k+'개</span></span></div>'+
      '<button class="iconbtn" data-act="cat-move" data-i="'+i+'" data-d="-1" aria-label="위로"'+(i===0?' disabled':'')+'>'+svg(UI.up)+'</button>'+
      '<button class="iconbtn" data-act="cat-move" data-i="'+i+'" data-d="1" aria-label="아래로"'+(i===n-1?' disabled':'')+'>'+svg(UI.down)+'</button>'+
      (k?'':'<button class="iconbtn" data-act="cat-del" data-i="'+i+'" aria-label="분류 삭제">'+svg(UI.trash)+'</button>')+'</div>';
  }).join('')+'</div>';
  h+='<div class="toolbar"><input id="newcat" maxlength="12" placeholder="새 분류 이름 (예: 시즌 음료)" autocomplete="off"><button class="btn" data-act="cat-add">'+svg(UI.plus)+'추가</button></div>';
  h+='<p class="sub" style="font-size:12.5px">품목이 있는 분류는 지울 수 없어요. 품목을 다른 분류로 옮기거나 숨기면 돼요.</p>';
  if(S.sheetErr)h+='<p class="err">'+esc(S.sheetErr)+'</p>';
  h+='<div class="actions"><button class="btn" data-act="sheet-close">취소</button><button class="btn primary" data-act="cats-save">저장</button></div>';
  return h;
}
function nextInSeq(id){
  var list=setupFiltered(),i=list.findIndex(function(x){return x.id===id;});
  for(var k=i+1;k<list.length;k++)if(list[k].id!==id)return list[k].id;
  return null;
}
function openSheet(s){S.sheet=s;S.sheetErr='';S.forceRender=true;render();}

/* ---------- toast ---------- */
var toastTimer=null;
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true;},2600);}

/* ---------- events ---------- */
document.addEventListener('focusout',function(){setTimeout(function(){if(S.deferred&&!editingField())render();},0);});
document.addEventListener('input',function(ev){
  var el=ev.target;
  if(el.id==='by'){S.by=el.value;lsSet(LS_BY,S.by);return;}
  if(el.id==='q'){S.q=el.value;var box=$('#setup-list');if(box)box.innerHTML=setupList();return;}
  if(el.classList.contains('catname')&&S.sheet&&S.sheet.type==='cats'){S.sheet.list[+el.getAttribute('data-ci')].name=el.value;return;}
  var id=el.getAttribute('data-id');
  if(el.hasAttribute('data-f')){
    var f=el.getAttribute('data-f'),d=Object.assign({},S.draft[id]);d[f]=el.value;
    if(!d.n&&!d.box&&!d.loose)delete S.draft[id];else S.draft[id]=d;saveDraft();
    el.classList.toggle('filled',!!el.value);
    var it=itemById(id),q=totalOf(it,S.draft[id]);
    var w=document.getElementById('w-'+id);if(w)w.textContent=anomaly(info(it),q);
    var t=document.getElementById('t-'+id);if(t)t.textContent=q!=null&&!Number.isNaN(q)?'= '+fq(q,it.unit):'';
    var sb=$('#sb-n');if(sb)sb.textContent=draftEntries().length+'개 입력 · 전체 '+activeItems().length+'개';
  }
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&S.sheet){S.sheet=null;S.forceRender=true;render();}
});
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;
  var act=el.getAttribute('data-act'),id=el.getAttribute('data-id');
  if(act==='sheet-bg'){if(ev.target===el){S.sheet=null;S.forceRender=true;render();}return;}
  if(el.tagName==='BUTTON')ev.preventDefault();
  S.forceRender=true;
  switch(act){
    case 'start':run(function(){return store.seed();},'조사표 품목을 불러왔어요');break;
    case 'retry':refresh();break;
    case 'logout':logout('');break;
    case 'jump':var t=document.getElementById(el.getAttribute('data-target'));if(t)t.scrollIntoView({behavior:'smooth',block:'start'});S.forceRender=false;break;
    case 'order-open':openSheet({type:'order',id:id});break;
    case 'eta-pick':$('#oe').value=el.getAttribute('data-v');S.forceRender=false;break;
    case 'order-save':saveOrder(id);break;
    case 'order-done':closeOrder(id,'done','도착 처리했어요. 다음 재고 조사에서 수량이 반영돼요');break;
    case 'order-drop':closeOrder(id,'cancelled','주문을 취소했어요');break;
    case 'setup-unset':
      S.filter='unset';S.cat='all';S.q='';
      var first=setupFiltered()[0];
      S.sheet=first?{type:'item',id:first.id,seq:true}:null;S.sheetErr='';
      if(location.hash!=='#setup')location.hash='#setup';else{S.forceRender=true;render();}
      break;
    case 'review':
      if(!draftEntries().length){toast('입력한 수량이 없어요');break;}
      if(!S.by.trim()){toast('확인 담당자 이름을 적어주세요');var b=$('#by');if(b){b.focus();b.scrollIntoView({block:'center'});}break;}
      openSheet({type:'review'});break;
    case 'sheet-close':S.sheet=null;render();break;
    case 'fix':S.sheet=null;render();var it=itemById(id);var inp=document.getElementById((it&&it.perBox?'b-':'n-')+id);if(inp){inp.scrollIntoView({block:'center'});inp.focus();}break;
    case 'save-count':saveCount();break;
    case 'filter':S.filter=el.getAttribute('data-f');render();break;
    case 'cat':S.cat=el.getAttribute('data-c');render();break;
    case 'item-open':openSheet({type:'item',id:id,seq:S.filter==='unset'||S.filter==='review'});break;
    case 'add-open':openSheet({type:'add'});break;
    case 'cats-open':openSheet({type:'cats',list:cats().map(function(c){var o={id:c.id,name:c.name};if(!CAT_BY[c.id])o.h=c.h;return o;})});break;
    case 'cat-move':var L=S.sheet.list,i=+el.getAttribute('data-i'),j=i+(+el.getAttribute('data-d'));if(j>=0&&j<L.length){var tmp=L[i];L[i]=L[j];L[j]=tmp;}render();break;
    case 'cat-del':S.sheet.list.splice(+el.getAttribute('data-i'),1);render();break;
    case 'cat-add':var nm=($('#newcat').value||'').trim().slice(0,12);if(!nm){S.sheetErr='새 분류 이름을 적어주세요';render();break;}
      S.sheet.list.push({id:'c-'+uid(),name:nm,h:EXTRA_HUES[S.sheet.list.length%EXTRA_HUES.length]});S.sheetErr='';render();break;
    case 'cats-save':saveCats();break;
    case 'unit-pick':$('#it-unit').value=el.getAttribute('data-v');S.forceRender=false;break;
    case 'item-save':saveItem(id,el.getAttribute('data-next'));break;
    case 'add-save':addItem();break;
    case 'toggle-hide':
      var target=itemById(id),wasHidden=target&&target.active===false;
      commitCatalog(function(list){return list.map(function(i){return i.id===id?Object.assign({},i,{active:i.active===false}):i;});},wasHidden?'다시 쓰는 품목으로 바꿨어요':'숨겼어요. 「숨김」에서 되돌릴 수 있어요').then(function(ok){if(ok){S.sheet=null;S.forceRender=true;render();}});
      break;
    case 'log-open':S.logOpen=S.logOpen===id?null:id;render();break;
  }
  S.forceRender=false;
});

function sheetFail(msg){S.sheetErr=msg;S.forceRender=true;render();}
function saveOrder(itemId){
  var it=itemById(itemId),q=num($('#oq').value),eta=$('#oe').value;
  if(q==null||Number.isNaN(q)||q<=0)return sheetFail('주문한 수량을 숫자로 적어주세요');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(eta))return sheetFail('도착 예정일을 골라주세요');
  var o={id:uid(),itemId:itemId,qty:q,eta:eta,at:Date.now(),status:'open'};
  run(function(){return store.putOrder(o);},(it?it.name:'')+' 주문 기록 · '+fmtYmd(eta)+'까지 알림을 쉬어요').then(function(ok){if(ok){S.sheet=null;S.forceRender=true;render();}});
}
function closeOrder(orderId,status,msg){
  var o=S.orders.find(function(x){return x.id===orderId;});if(!o)return;
  run(function(){return store.putOrder(Object.assign({},o,{status:status,closedAt:Date.now()}));},msg);
}
function saveCount(){
  var ents=draftEntries();
  if(ents.some(function(e){return Number.isNaN(e.q);}))return sheetFail('숫자가 아닌 칸이 있어요.');
  var values={};ents.forEach(function(e){values[e.item.id]=e.q;});
  var doc={at:Date.now(),by:S.by.trim().slice(0,20),values:values},id=uid();
  run(function(){return store.addCount(id,doc);}).then(function(ok){
    if(!ok)return;
    S.draft={};saveDraft();S.sheet=null;
    var need=activeItems().map(info).filter(function(i){return i.st==='order';}).length;
    location.hash='#home';
    toast(ents.length+'개 품목 저장 · 주문 필요 '+need+'개');
  });
}
function readItemForm(){
  var name=$('#it-name').value.trim().slice(0,40),unit=normUnit($('#it-unit').value).slice(0,6),th=num($('#it-th').value),pb=num($('#it-pb').value);
  if(!name)return {err:'품목명을 적어주세요'};
  if(Number.isNaN(th))return {err:'주문기준은 숫자로 적어주세요'};
  if(Number.isNaN(pb))return {err:'박스당 수량은 숫자로 적어주세요'};
  return {name:name,unit:unit,threshold:th,perBox:pb&&pb>0?pb:null,cat:$('#it-cat').value};
}
function commitCatalog(mutate,okMsg,catList){
  var cat=Object.assign({},S.catalog,{items:mutate(items()),updatedAt:Date.now()});
  if(catList)cat.cats=catList;
  return run(function(){return store.setCatalog(cat);},okMsg);
}
function saveItem(id,nextId){
  var f=readItemForm();if(f.err)return sheetFail(f.err);
  commitCatalog(function(list){return list.map(function(i){
    if(i.id!==id)return i;
    return Object.assign({},i,{name:f.name,unit:f.unit,threshold:f.threshold,perBox:f.perBox,cat:f.cat||i.cat,review:f.name!==i.name?false:i.review});
  });},nextId?null:'저장했어요').then(function(ok){
    if(!ok)return;
    if(nextId&&itemById(nextId)){S.sheet={type:'item',id:nextId,seq:true};S.sheetErr='';toast('저장했어요 · 다음 품목');}
    else S.sheet=null;
    S.forceRender=true;render();
  });
}
function saveCats(){
  var list=S.sheet.list.map(function(c){var o={id:c.id,name:(c.name||'').trim()};if(c.h!=null)o.h=c.h;return o;});
  if(list.some(function(c){return !c.name;}))return sheetFail('비어 있는 분류 이름이 있어요');
  var names={};for(var i=0;i<list.length;i++){if(names[list[i].name])return sheetFail('「'+list[i].name+'」 분류가 두 개예요');names[list[i].name]=1;}
  var ids={};list.forEach(function(c){ids[c.id]=1;});
  if(items().some(function(it){return !ids[it.cat];}))return sheetFail('품목이 남아 있는 분류는 지울 수 없어요');
  commitCatalog(function(l){return l;},'분류를 저장했어요',list).then(function(ok){if(ok){if(S.cat!=='all'&&!ids[S.cat])S.cat='all';S.sheet=null;S.forceRender=true;render();}});
}
function addItem(){
  var f=readItemForm();if(f.err)return sheetFail(f.err);
  var catId=f.cat;
  var item={id:catId+'-'+uid(),cat:catId,name:f.name,unit:f.unit,perBox:f.perBox,threshold:f.threshold,active:true,review:false};
  commitCatalog(function(list){return list.concat([item]);},f.name+' 추가했어요').then(function(ok){if(ok){S.sheet=null;S.forceRender=true;render();}});
}

/* ---------- 분류 끌어서 순서 바꾸기 ---------- */
var drag=null;
document.addEventListener('pointerdown',function(ev){
  var g=ev.target.closest&&ev.target.closest('.grip');
  if(!g||!S.sheet||S.sheet.type!=='cats'||(ev.pointerType==='mouse'&&ev.button!==0))return;
  ev.preventDefault();
  var row=g.closest('.catrow'),rows=[].slice.call(row.parentElement.querySelectorAll('.catrow'));
  var sc=document.querySelector('.sheet');
  drag={row:row,rows:rows,from:rows.indexOf(row),to:rows.indexOf(row),y0:ev.clientY,s0:sc.scrollTop,sc:sc,
    rects:rows.map(function(r){return r.getBoundingClientRect();})};
  try{g.setPointerCapture(ev.pointerId);}catch(e){}
  row.classList.add('dragging');document.body.classList.add('dragging-cat');
  if(navigator.vibrate)try{navigator.vibrate(8);}catch(e){}
});
document.addEventListener('pointermove',function(ev){
  if(!drag)return;
  ev.preventDefault();
  var d=drag,sr=d.sc.getBoundingClientRect();
  if(ev.clientY<sr.top+56)d.sc.scrollTop-=10;else if(ev.clientY>sr.bottom-56)d.sc.scrollTop+=10;
  var first=d.rects[0],last=d.rects[d.rects.length-1],me=d.rects[d.from];
  var dy=ev.clientY-d.y0+(d.sc.scrollTop-d.s0);
  dy=Math.max(first.top-me.top,Math.min(last.bottom-me.bottom,dy));
  d.row.style.transform='translateY('+dy+'px)';
  var top=me.top+dy,bot=me.bottom+dy,to=d.from;
  for(var k=0;k<d.rects.length;k++){var c=d.rects[k].top+d.rects[k].height/2;if(k>d.from&&bot>c)to=k;if(k<d.from&&top<c&&to===d.from)to=k;}
  d.to=to;
  d.rows.forEach(function(r,k){
    if(k===d.from)return;
    var shift=(d.from<k&&k<=to)?-me.height:(to<=k&&k<d.from)?me.height:0;
    r.style.transform=shift?'translateY('+shift+'px)':'';
  });
});
function endDrag(){
  if(!drag)return;
  var d=drag;drag=null;document.body.classList.remove('dragging-cat');
  if(d.to!==d.from){var L=S.sheet.list,moved=L.splice(d.from,1)[0];L.splice(d.to,0,moved);}
  S.forceRender=true;render();
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);

/* ---------- boot ---------- */
function readRoute(){
  var h=location.hash.slice(1);route=['home','count','log','setup'].indexOf(h)>=0?h:'home';
  if(S.sheet&&S.sheet.type!=='item')S.sheet=null;
  S.forceRender=true;render();window.scrollTo(0,0);
}
window.addEventListener('hashchange',readRoute);
readRoute();
document.addEventListener('submit',function(ev){
  if(ev.target.id!=='login-form')return;
  ev.preventDefault();
  var code=$('#code').value.trim();if(!code)return;
  var btn=$('#login-btn');btn.disabled=true;btn.textContent='확인 중…';
  API.setCode(code);
  API.call('whoami').then(function(role){
    S.role=role;S.loginErr='';S.mode='loading';S.forceRender=true;render();refresh();
  },function(e){
    API.setCode('');S.loginErr=e.message;S.forceRender=true;render();
  });
});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&S.mode==='ready'&&!S.sheet)refresh();});
setInterval(function(){if(document.visibilityState==='visible'&&S.mode==='ready'&&!editingField()&&!S.sheet)refresh();},60000);
(function boot(){
  var cache=lsGet(LS_CACHE);
  if(!API.getCode())S.mode='login';
  else if(cache&&cache.role){applyData(cache);S.mode='ready';S.offline=false;}
  S.forceRender=true;render();
  refresh();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
})();
</script>
